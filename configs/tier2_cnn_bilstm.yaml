experiment_name: "tier2_cnn_bilstm"
description: "Tier 2: CNN-BiLSTM Hybrid with GloVe embeddings"
output_dir: "experiments/tier2_cnn_bilstm"
label_scheme: "5class"

data:
  max_sequence_length: 128

model:
  tier: "tier2"
  model_type: "cnn_bilstm"
  embedding_dim: 300
  embedding_source: "glove"
  cnn_filter_sizes: [3, 4, 5]
  cnn_num_filters: 100
  hidden_size: 128
  num_layers: 1
  dropout: 0.3
  vocab_size: 30000

training:
  seeds: [13, 42, 2024]
  batch_size: 64
  learning_rate: 0.001
  epochs: 15
  early_stopping_patience: 3
  loss: "cross_entropy_weighted"
